; WaCa Cutscenes - SHAPES: how a cutscene's cats stand. Add your own here or in your mod's content\shapes.ini.
;
; [Shape.<Name>]
;   <Group><n> = <forward> <side>     a mark, in cm from the place's middle: forward = away from the camera's side of
;                                     the scene, side = to the right (negative: left). A group is one capital letter;
;                                     a cutscene fills it in order: A = Player, Deputy -> A1, A2.
;   Face<Group or mark> = <target>    which way they look: Middle (the place's middle - the default), Camera (towards
;                                     the camera's side), Forward, a group (its middle) or a mark. A mark's own line wins
;                                     over its group's.

; two sides face each other across the middle - a standoff, a meeting of two patrols
[Shape.Facing]
A1 = 0 -170
A2 = 110 -230
A3 = -110 -230
A4 = 220 -290
A5 = -220 -290
B1 = 0 170
B2 = 110 230
B3 = -110 230
B4 = 220 290
B5 = -220 290
FaceA = B
FaceB = A

; a ring looking in - sharing tongues, a council
[Shape.Circle]
C1 = 170 0
C2 = 120 -120
C3 = 120 120
C4 = 0 -170
C5 = 0 170
C6 = -120 -120
C7 = -120 120
C8 = -170 0
FaceC = Middle

; a row looking at the camera's side
[Shape.Line]
L1 = 0 0
L2 = 0 -110
L3 = 0 110
L4 = 0 -220
L5 = 0 220
L6 = 0 -330
L7 = 0 330
FaceL = Camera

; two cats face to face - a talk
[Shape.Pair]
P1 = 0 -65
P2 = 0 65
FaceP1 = P2
FaceP2 = P1

; a speaker (S1) before the clan (C) - a clan meeting
[Shape.Meeting]
S1 = 300 0
C1 = 0 0
C2 = 10 -80
C3 = 10 80
C4 = 40 -150
C5 = 40 150
C6 = 90 -210
C7 = 90 210
C8 = 150 -260
C9 = 150 260
FaceS = C
FaceC = S1

; a ceremony: the leader (L1) and the cat being named (K1) face each other, its mentor (M1) beside it, the clan (C)
; round them
[Shape.Ceremony]
L1 = 260 0
K1 = 130 0
M1 = 110 -110
C1 = 180 -210
C2 = 180 210
C3 = 60 -250
C4 = 60 250
C5 = -40 -190
C6 = -40 190
C7 = -100 -90
C8 = -100 90
FaceL = K1
FaceK = L1
FaceM = L1
FaceC = K1
