; WaCa Cutscenes - cutscenes from plain text. Write your own here or, better, in your own mod's content\cutscenes.ini
; (a folder with enabled.txt and content\ - no code). Play one from a Clan Life scene ("Cutscene: <Name>"), from any
; mod (WaCa.Emit("PlayCutscene", "<Name>")), or with the PreviewKey below while writing.

[Cutscenes]
; 0 = no cutscene plays (a scene asking for one goes straight on)
On = 1
; Here: how far in front of your cat the scene's middle is (cm)
Ahead = 250
; WalkIn: how far out the cats start (cm), and how fast they walk (cm/s)
WalkFrom = 600
WalkSpeed = 120
; a cutscene ends at the latest after this (seconds)
MaxSeconds = 180
; the game's HUD hidden while one plays
HideHud = 1
; how far below the screen's middle the lines (Say) stand, in the game's screen units (1080 = the screen's height)
LineOffset = 380
; 1 = your cat goes back where it stood before; 0 = it stays where the cutscene left it
PutPlayerBack = 0
; for writers: a key that logs where your cat stands (a places.ini line), and a key that plays the Preview cutscene
; (key names as in the game's input: F9, F10, P ... - empty = no key)
WhereKey =
PreviewKey =
; the key that skips a playing cutscene (empty: none) - it ends as at its End beat
SkipKey = SpaceBar
Preview = Standoff

[Camera]
; the camera's field of view (degrees); Wide: how far back / up (cm); Orbit: radius (cm) and speed (degrees/s);
; Portrait: how far in front of the face (cm)
FOV = 60
WideBack = 700
WideUp = 300
OrbitRadius = 650
OrbitSpeed = 9
Portrait = 170

; --- examples (they only play when asked for) ---

; two cats of your clan step up to you and your deputy
[Cutscene.Standoff]
Place = Here
Shape = Facing
A = Player, Deputy
B = Nearest, Nearest
Beat1 = 0 WalkIn: B
Beat2 = 0 Camera: Wide
Beat3 = 4 Camera: Two = A1 & B1 ~2
Beat4 = 6 Say: B1 = You took your time.
Beat5 = 9 Pose: A2 = Growl
Beat6 = 9 Camera: Portrait = A2
Beat7 = 10 Say: A2 = Mind your tongue.
Beat8 = 13 Camera: Over = A1 > B1 ~1.5
Beat9 = 16 End

; the leader speaks to the clan
[Cutscene.ClanMeeting]
Place = Here
Shape = Meeting
S = Leader
C = Player, Deputy, Nearest, Nearest, Nearest, Nearest
Beat1 = 0 Camera: Wide
Beat2 = 1 Pose: C = Sit
Beat3 = 3 Camera: Portrait = S1 ~2
Beat4 = 5 Say: S1 = Let all cats old enough to catch their own prey gather here.
Beat5 = 10 Camera: Orbit ~2
Beat6 = 16 End

; a quiet word between two cats
[Cutscene.Talk]
Place = Here
Shape = Pair
P = Player, Nearest
Beat1 = 0 Camera: Two = P1 & P2
Beat2 = 1 Say: P2 = Have you seen the sky tonight?
Beat3 = 5 Camera: Over = P1 > P2
Beat4 = 6 Pose: P2 = Meow
Beat5 = 9 End

; One of the GAME'S OWN scenes with its cats dressed as yours: the rank-up ceremony in your camp (Scene = RankUp; the
; leader's at the Moonpool: RankUp.Leader; StarClan's cats at a prophecy's end: Prophecy.Closure - its jobs
; StarClanAncestor, Manifestation.1-3), its leader played by your clan's medicine cat. Every other key names one of
; the scene's cats by its clan job - Leader, Deputy, MedicineCat, Warrior.2 (the scene's second warrior) ... - and who
; it is (any cast: a name, a part, E: / S: roles). The log lists a scene's jobs when one you name isn't in it. Only the
; scene plays: no rank changes. The game's own HOLD SKIP skips it.
[Cutscene.Ceremony]
Scene = RankUp
Leader = MedicineCat
