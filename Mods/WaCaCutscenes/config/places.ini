; WaCa Cutscenes - PLACES: named spots a cutscene can play at (Place = <Name>). Add your own here or in your mod's
; content\places.ini. Built in, without a line here: Here (in front of your cat, the scene facing away from the camera)
; and Pile (the nearest fresh-kill pile).
;
; [Place.<Name>]
;   At = <X> <Y> <Z>          the place's middle (the game's world units, cm) - stand there in game and press the
;                             cutscenes.ini WhereKey: the log (UE4SS.log) gets the line to paste here
;   Yaw = <degrees>           which way the scene faces (0 = +X); left out: away from your cat when it starts
;
; [Place.Example]
; At = 1000 2000 300
; Yaw = 90
